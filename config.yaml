# SPLiT-TAP-seq Pipeline Configuration
#
# Experiment: Re-processing of the JB_ST_001 data
#
#

# Guide mode: "single" for one guide per construct, "paired" for two guides per construct
guide_mode: "single"  # Options: "single" or "paired"

# Input data configuration
data_dir: "../JB_ST_001/screen/usftp21.novogene.com/01.RawData"  # Directory containing raw FASTQ files
wells: ["a1", "a2", "a3", "a4", "a5", "a6", "a7", "b1", "b2", "b3", "b4", "b5", "b7", "c1", "c2", "c3", "c4", "c5", "c6", "c7"]  # List of well names to process

# Barcoding configuration
i7_barcodes_csv: "../JB_ST_001/screen_reprocess/i7_barcodes.csv"  # CSV file with well, sample_name, i7_index columns

# Guide library files
# For paired mode, provide the spacer pairs file
spacer_pairs_csv: ""  # Required for paired mode
# For single mode, provide the guide library file
guide_library_csv: "../JB_ST_001/screen/targetingGuides_Final.csv"  # Required for single mode

# Reference genome configuration
genome_dir: "/oak/stanford/groups/larsms/Users/jrbauman/scRNA-DNA/20231023_SplitTAP_pilot/homebrewParse/genomes/hg38"
star_genome_dir: "../JB_ST_001/final_reprocess/STAR/cDNA_genome"
star_gtf: "../JB_ST_001/final_reprocess/STAR/cDNA_REF.gtf"

# Processing options
cdna_adapter_trim: true  # Set to true to enable cutadapt trimming for cDNA
cdna_polya_trim: true  # Set to true to trim polyA sequences from cDNA

# CROP processing options (paired mode)
chimera_threshold: 0.25  # Threshold for chimera correction in theseus_impl.py

# Threading configuration
threads:
  parse: 8
  cutadapt: 20
  star: 3
  pigz: 20
  featurecounts: 3

# Resource configuration
resources:
  parse_mem: "30G"
  star_mem: "32G"
  featurecounts_mem: "10G"

# Output directory
output_dir: "../JB_ST_001/final_reprocess/outputs"

# Scripts directory (relative to cwd)
scripts_dir: "Scripts"

# Knee plot: number of cells (ranked by UMI count) at which to draw the red reference line.
# Visualization only - the pipeline does not filter cells.
knee_plot_threshold: 700000
