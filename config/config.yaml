paths:
  output_dir: "../Data"

split_pipe:
  genome_dir: "../../../scRNA-DNA/20231023_SplitTAP_pilot/homebrewParse/genomes/hg38"
  chemistry: "v1"
  extra_args: ""

star:
  index: "../STAR"
  threads: 8
  extra_args: ""

feature_counts:
  gtf: "../Homo_sapiens.GRCh38.108_chr19.gtf"
  extra_args: "-t exon -g gene_id"
  threads: 4

umi_tools:
  extra_args: "--per-gene --gene-tag=XT --assigned-status-tag=XS --extract-umi-method=tag --umi-tag=UB"

guide_processing:
  tpt_threshold: 0.25
  histogram_dir: "../Data/guides/histograms"
  single_reference: "targetingGuides_Final.csv"

samples:
  chr19p:
    index: "SAMPLE_I7"
    cdna:
      enabled: true
      r1: "../Data/fastq_files/chr19p_cdna_S1_L001_R1_001.fastq.gz"
      r2: "../Data/fastq_files/chr19p_cdna_S1_L001_R2_001.fastq.gz"
      trim:
        enabled: false
        adapters:
          r1:
            - "AGATCGGAAGAGC"
            - "A{10}N{100}"
          r2:
            - "AGATCGGAAGAGC"
        minimum_length: 20
        quality_cutoff: "0,20"
        extra_args: ""
    guides:
      enabled: false  # set to true and update paths to process guide libraries
      mode: dual
      r1: "path/to/crop_R1.fastq.gz"
      r2: "path/to/crop_R2.fastq.gz"
      spacer_to_r1: true
      split_pipe_extra: ""
      tpt_threshold: 0.25
